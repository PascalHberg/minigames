<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Invaders</title>
<link rel="stylesheet" href="../../shared/style.css">
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100svh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.wrap{position:relative;display:flex;flex-direction:column;gap:10px;padding:10px}
.back{align-self:flex-start;color:var(--mut);font-size:12px;text-decoration:none;border:1px solid var(--edge);border-radius:6px;padding:6px 10px}
canvas{display:block;width:min(480px,calc(100vw - 26px),calc((100svh - 80px) * 3 / 4));height:auto;aspect-ratio:3/4;background:var(--lane);border:3px solid var(--edge);box-shadow:0 0 22px rgba(59,76,255,.7),inset 0 0 30px rgba(59,76,255,.25);cursor:pointer;outline:none}
.back:focus-visible,canvas:focus-visible{outline:2px solid #fff}
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
  <a class="back" href="../../index.html">← Menü</a>
  <canvas id="g" width="480" height="640" tabindex="0" aria-label="Space Invaders Spielfeld"></canvas>
</div>
<script src="../../shared/core.js"></script>
<script>
(function(){
var KEY='spaceinvaders_hi',W=480,H=640,P=3,cv=document.getElementById('g'),ctx=cv.getContext('2d');
Core.stars(document.getElementById('stars'));
var SA=['00100000100','00010001000','00111111100','01101110110','11111111111','10111111101','10100000101','00011011000'];
var SB=['00100000100','10010001001','10111111101','11101110111','11111111111','01111111110','00100000100','01000000010'];
var COL=['#ff4d4d','#ffb020','#f5f06a','#3ddc6a','#3db8ff'],PTS=[30,20,20,10,10];
var IC={D:'#3db8ff',L:'#ff4dff',S:'#ffd84d',T:'#2fd6c2'};
var st='ready',score=0,hi=Core.getHi(KEY),lives=3,wave=1,pl={x:W/2,y:H-50},pbs=[],inv=[],ib=[],pa=[],ufo=null;
var items=[],bombs=[],ex=[],tr=[],tbs=[],dblLv=0,burstCd=0,laser=0,shield=0,itemT=16,AC=null;
var dir=1,stepT=0,frame=0,stepN=0,fireT=1,ufoT=10,hurt=0,keys={l:0,r:0},target=null,firing=false;

function build(){inv=[];for(var r=0;r<5;r++)for(var c=0;c<8;c++)inv.push({x:50+c*48,y:80+r*36+Math.min(wave-1,5)*12,r:r});dir=1;stepT=.5;ib=[];bombs=[];pbs=[];tbs=[];}
function start(){score=0;lives=3;wave=1;hurt=0;ufo=null;pl.x=W/2;pa=[];items=[];ex=[];tr=[];tbs=[];dblLv=0;burstCd=0;laser=0;shield=0;itemT=16;ufoT=10;build();st='play';}
function over(){st='over';if(score>hi){hi=score;Core.setHi(KEY,hi);}Core.tone(120,.7,'sawtooth',.14,30);}
function boom(x,y,c){for(var i=0;i<10;i++){var a=Math.random()*6.283,s=40+Math.random()*120;pa.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5,c:c});}}

function addPb(x,y,ang,homing){
  var spd=540;
  var tg=homing?near({x:x,y:y}):null;
  pbs.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,homing:homing,tg:tg});
}

function shoot(){
  if(laser>0)return;
  if(dblLv===0){
    if(pbs.length)return;
    addPb(pl.x,pl.y-14,-Math.PI/2,false);
  }else{
    if(burstCd>0)return;
    burstCd=0.14;
    var hm=(dblLv>=3);
    addPb(pl.x-11,pl.y-14,-Math.PI/2,hm);
    addPb(pl.x+11,pl.y-14,-Math.PI/2,hm);
    if(dblLv>=2){
      var a15=Math.PI/12;
      addPb(pl.x-14,pl.y-10,-Math.PI/2-a15,hm);
      addPb(pl.x+14,pl.y-10,-Math.PI/2+a15,hm);
    }
  }
  Core.tone(dblLv>=3?1120:880,.08,'square',.04,300);
}

function hit(){
  if(shield>0){shield--;hurt=.8;ib=[];boom(pl.x,pl.y,'#ffd84d');Core.tone(420,.25,'triangle',.1,160);return;}
  lives--;ib=[];hurt=1.6;dblLv=Math.max(0,dblLv-1);boom(pl.x,pl.y,'#3dff6a');Core.tone(150,.5,'sawtooth',.14,40);if(lives<=0)over();}
function drop(x,y){var t='DLST'[Math.floor(Math.random()*4)];items.push({x:x,y:y,t:t});}
function killInv(k){var v=inv[k];inv.splice(k,1);score+=PTS[v.r];boom(v.x+16,v.y+12,COL[v.r]);Core.tone(220,.14,'sawtooth',.07,60);if(Math.random()<.04)drop(v.x+16,v.y+12);}
function killUfo(){score+=[50,100,150,300][Math.floor(Math.random()*4)];boom(ufo.x,45,'#ff4d4d');Core.tone(700,.4,'triangle',.1,200);drop(ufo.x,50);ufo=null;}
function explode(m){var b=bombs.splice(m,1)[0];ex.push({x:b.x,y:b.y,t:.45});boom(b.x,b.y,'#ffb020');Core.tone(90,.45,'sawtooth',.14,30);tr.slice().forEach(function(t){if(Math.hypot(b.x-t.x,b.y-t.y)<60)dmgT(t);});
  if(st==='play'&&hurt<=0&&Math.hypot(b.x-pl.x,b.y-pl.y)<60)hit();}
function collect(t){
  if(t==='D'){dblLv=Math.min(3,dblLv+1);}
  else if(t==='L'){laser=3;pbs=[];}
  else if(t==='T')placeT();
  else shield=Math.min(3,shield+1);
  Core.tone(660,.18,'triangle',.1,1100);}

var TY=H-114,SL=[W/2,80,W-80];
function placeT(){for(var i=0;i<3;i++){if(!tr.some(function(t){return t.s===i;})){tr.push({s:i,x:SL[i],y:TY,hp:3,cd:.6,ang:-1.5708});return;}}
  var w=tr[0];tr.forEach(function(t){if(t.hp<w.hp)w=t;});if(w.hp<3)w.hp=3;else score+=50;}
function dmgT(t){var i=tr.indexOf(t);if(i<0)return;t.hp--;boom(t.x,t.y,'#2fd6c2');Core.tone(200,.2,'square',.08,80);
  if(t.hp<=0){tr.splice(i,1);boom(t.x,t.y,'#ffffff');boom(t.x,t.y,'#2fd6c2');}}
function alive(o){return o&&(o===ufo||inv.indexOf(o)>=0);}
function tc(o){return o===ufo?{x:o.x,y:46}:{x:o.x+16,y:o.y+12};}
function near(t){var best=null,bd=1e9;inv.forEach(function(v){var d=Math.hypot(v.x+16-t.x,v.y+12-t.y);if(d<bd){bd=d;best=v;}});
  if(ufo){var d2=Math.hypot(ufo.x-t.x,46-t.y);if(d2<bd)best=ufo;}return best;}
function march(f,d){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.06,t);
  g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}

function update(dt){
  for(var i=pa.length-1;i>=0;i--){var q=pa[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;if(q.t<=0)pa.splice(i,1);}
  for(i=ex.length-1;i>=0;i--){ex[i].t-=dt;if(ex[i].t<=0)ex.splice(i,1);}
  if(st!=='play')return;
  var m=330*dt;
  if(target!==null)pl.x+=Math.max(-m*1.5,Math.min(m*1.5,target-pl.x));else pl.x+=(keys.r-keys.l)*m;
  pl.x=Math.max(24,Math.min(W-24,pl.x));
  hurt-=dt;
  if(burstCd>0)burstCd-=dt;
  if(firing)shoot();
  itemT-=dt;if(itemT<=0){drop(20+Math.random()*(W-40),30);itemT=18+Math.random()*12;}
  for(var a=items.length-1;a>=0;a--){var it=items[a];it.y+=90*dt;
    if(Math.abs(it.x-pl.x)<28&&Math.abs(it.y-pl.y)<22){collect(it.t);items.splice(a,1);}
    else if(it.y>H)items.splice(a,1);}
  if(laser>0){laser-=dt;
    for(var k=inv.length-1;k>=0;k--){var w=inv[k];if(w.x+33>pl.x-9&&w.x<pl.x+9)killInv(k);}
    if(ufo&&Math.abs(ufo.x-pl.x)<26)killUfo();
    ib=ib.filter(function(o){return Math.abs(o.x-pl.x)>10;});
    for(var z=bombs.length-1;z>=0;z--)if(Math.abs(bombs[z].x-pl.x)<12)explode(z);
    if(laser<0)laser=0;}
  for(var s=pbs.length-1;s>=0;s--){
    var b=pbs[s];
    if(b.homing){
      if(!alive(b.tg))b.tg=near(b);
      if(alive(b.tg)){
        var c=tc(b.tg),ang=Math.atan2(c.y-b.y,c.x-b.x);
        b.vx=Math.cos(ang)*580;
        b.vy=Math.sin(ang)*580;
      }
    }
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    var gone=b.y<-10||b.y>H+10||b.x<-10||b.x>W+10;
    if(!gone)for(var j=0;j<inv.length;j++){var v=inv[j];if(b.x>v.x&&b.x<v.x+33&&b.y>v.y&&b.y<v.y+24){killInv(j);gone=true;break;}}
    if(!gone&&ufo&&Math.abs(b.x-ufo.x)<20&&b.y>34&&b.y<56){killUfo();gone=true;}
    if(!gone)for(var d=0;d<bombs.length;d++){var bo=bombs[d];if(Math.abs(b.x-bo.x)<10&&Math.abs(b.y-bo.y)<14){score+=25;explode(d);gone=true;break;}}
    if(gone)pbs.splice(s,1);
  }
  if(st!=='play')return;
  tr.forEach(function(t){t.cd-=dt;var g=near(t);if(g){var c=tc(g);t.ang=Math.atan2(c.y-t.y,c.x-t.x);
    if(t.cd<=0){t.cd=1;tbs.push({x:t.x,y:t.y-8,tg:g,vx:Math.cos(t.ang)*460,vy:Math.sin(t.ang)*460});Core.tone(620,.07,'square',.03,260);}}});
  for(var u=tbs.length-1;u>=0;u--){var tb=tbs[u];
    if(alive(tb.tg)){var c2=tc(tb.tg),aa=Math.atan2(c2.y-tb.y,c2.x-tb.x);tb.vx=Math.cos(aa)*460;tb.vy=Math.sin(aa)*460;}
    tb.x+=tb.vx*dt;tb.y+=tb.vy*dt;var dead=tb.y<-10||tb.y>H||tb.x<-10||tb.x>W+10;
    if(!dead)for(var h=0;h<inv.length;h++){var iv=inv[h];if(tb.x>iv.x-2&&tb.x<iv.x+35&&tb.y>iv.y-2&&tb.y<iv.y+26){killInv(h);dead=true;break;}}
    if(!dead&&ufo&&Math.abs(tb.x-ufo.x)<20&&tb.y>34&&tb.y<56){killUfo();dead=true;}
    if(dead)tbs.splice(u,1);}
  if(!inv.length){wave++;build();Core.tone(520,.2,'triangle',.1,1040);return;}
  stepT-=dt;
  if(stepT<=0){
    stepT=Math.max(.035,inv.length*.012)*Math.max(.55,1-(wave-1)*.07);
    var mn=1e9,mx=-1e9;inv.forEach(function(v){mn=Math.min(mn,v.x);mx=Math.max(mx,v.x+33);});
    if((dir>0&&mx+8>W-8)||(dir<0&&mn-8<8)){dir*=-1;inv.forEach(function(v){v.y+=16;});}else inv.forEach(function(v){v.x+=dir*8;});
    frame^=1;march([110,98,87,73][stepN++%4]*(1+(1-inv.length/40)*1.5),Math.min(.08,stepT*.8));
  }
  for(var e=0;e<inv.length;e++)if(inv[e].y+24>=pl.y-6){over();return;}
  fireT-=dt;
  if(fireT<=0){
    fireT=Math.max(.35,1.1-wave*.06)*(.6+Math.random()*.8);
    var cols={};inv.forEach(function(v){var c=Math.round(v.x/8);if(!cols[c]||v.y>cols[c].y)cols[c]=v;});
    var ks=Object.keys(cols),bb=cols[ks[Math.floor(Math.random()*ks.length)]];
    var sx=bb.x+16,sy=bb.y+24,speed=210+wave*15;
    var aimX=pl.x+(pl.x<50?-12:(pl.x>W-50?12:0));
    var dx=aimX-sx,dy=pl.y-sy,len=Math.hypot(dx,dy)||1;
    var vx=dx/len*speed,vy=dy/len*speed;
    ib.push({x:sx,y:sy,vx:vx,vy:vy});
    if(wave>=2||pl.x<55||pl.x>W-55){
      var spread=.18,c=Math.cos(spread),s=Math.sin(spread);
      ib.push({x:sx,y:sy,vx:vx*c-vy*s,vy:vx*s+vy*c});
      ib.push({x:sx,y:sy,vx:vx*c+vy*s,vy:-vx*s+vy*c});
    }
  }
  for(var n=ib.length-1;n>=0;n--){
    var o=ib[n];o.x+=o.vx*dt;o.y+=o.vy*dt;var bl=null;tr.forEach(function(t){if(!bl&&Math.abs(o.x-t.x)<22&&o.y>t.y-8&&o.y<t.y+10)bl=t;});if(bl){ib.splice(n,1);dmgT(bl);continue;}
    if(hurt<=0&&Math.abs(o.x-pl.x)<22&&o.y>pl.y-10&&o.y<pl.y+14){ib.splice(n,1);hit();break;}
    if(o.y>H||o.x<-10||o.x>W+10)ib.splice(n,1);
  }
  if(st!=='play')return;
  for(var q2=bombs.length-1;q2>=0;q2--){var bm=bombs[q2];bm.y+=170*dt;var bt=null;tr.forEach(function(t){if(!bt&&Math.abs(bm.x-t.x)<24&&bm.y>=t.y-10)bt=t;});
    if(bt||bm.y>=pl.y-6){explode(q2
