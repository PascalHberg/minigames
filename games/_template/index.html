<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neues Spiel</title>
<link rel="stylesheet" href="../../shared/style.css">
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100svh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.wrap{position:relative;display:flex;flex-direction:column;gap:10px;padding:10px}
.back{align-self:flex-start;color:var(--mut);font-size:12px;text-decoration:none;border:1px solid var(--edge);border-radius:6px;padding:6px 10px}
canvas{display:block;width:min(480px,calc(100vw - 26px),calc((100svh - 80px) * 3 / 4));height:auto;aspect-ratio:3/4;background:var(--lane);border:3px solid var(--edge);box-shadow:0 0 22px rgba(59,76,255,.7),inset 0 0 30px rgba(59,76,255,.25);cursor:pointer;outline:none}
.back:focus-visible,canvas:focus-visible{outline:2px solid #fff}
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
  <a class="back" href="../../index.html">← Menü</a>
  <canvas id="g" width="480" height="640" tabindex="0" aria-label="Spielfeld"></canvas>
</div>
<script src="../../shared/core.js"></script>
<script>
/* VORLAGE für ein neues Spiel
 * 1. Ordner kopieren und umbenennen (ohne "_" am Anfang), z. B. games/snake/
 * 2. game.json anpassen (Titel, Beschreibung, Farbe, eindeutiger hiKey)
 * 3. HI_KEY unten auf denselben Wert wie hiKey in game.json setzen
 * 4. update() und draw() durch das eigene Spiel ersetzen
 * Das Beispiel hier: Tippe in 10 Sekunden so oft wie möglich auf das Ziel. */
(function(){
var HI_KEY='template_hi',W=480,H=640,cv=document.getElementById('g'),ctx=cv.getContext('2d');
Core.stars(document.getElementById('stars'));
var state='ready',score=0,hi=Core.getHi(HI_KEY),left=10,t={x:240,y:320,r:30};

function moveTarget(){t.x=40+Math.random()*(W-80);t.y=120+Math.random()*(H-200);}
function start(){score=0;left=10;moveTarget();state='play';}
function over(){state='over';if(score>hi){hi=score;Core.setHi(HI_KEY,hi);}Core.tone(150,.5,'sawtooth',.12,40);}

function update(dt){if(state!=='play')return;left-=dt;if(left<=0)over();}

function tx(s,x,y,size,col,al){ctx.fillStyle=col;ctx.font='bold '+size+'px Orbitron,"Trebuchet MS",Arial,sans-serif';ctx.textAlign=al||'center';ctx.fillText(s,x,y);}
function draw(){
  ctx.clearRect(0,0,W,H);
  tx('PUNKTE '+score,14,28,16,'#3dff6a','left');tx('REKORD '+hi,W-14,28,16,'#8a97d6','right');
  if(state==='play'){
    tx('Zeit: '+Math.ceil(left),W/2,28,16,'#ffffff');
    ctx.fillStyle='#ff4d4d';ctx.shadowColor='#ff4d4d';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();ctx.shadowBlur=0;
  }
  if(state==='ready'){tx('NEUES SPIEL',W/2,260,34,'#ffffff');tx('Tippe auf das Ziel, so oft du kannst.',W/2,310,14,'#dfe6ff');tx('Tippen oder Leertaste zum Start',W/2,370,16,'#3dff6a');}
  if(state==='over'){tx('ZEIT ABGELAUFEN',W/2,250,30,'#ff4d4d');tx('Punkte: '+score,W/2,300,20,'#ffffff');tx(score>0&&score>=hi?'Neuer Rekord!':'Rekord: '+hi,W/2,335,16,'#3dff6a');tx('Tippen oder Leertaste für neues Spiel',W/2,400,14,'#dfe6ff');}
}

cv.addEventListener('pointerdown',function(e){
  if(state!=='play'){start();return;}
  var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(Math.hypot(x-t.x,y-t.y)<=t.r){score++;Core.tone(660,.06,'square',.05);moveTarget();}
});
addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();if(state!=='play')start();}});

var last=performance.now();
function loop(now){var dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);cv.focus();
})();
</script>
</body>
</html>
