<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUPERBALL</title>
<style>
:root{--bg:#050818;--lane:#0a1030;--edge:#3b4cff;--txt:#dfe6ff;--mut:#8a97d6;--green:#3dff6a;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Orbitron","Trebuchet MS",Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.wrap{display:flex;gap:18px;align-items:center;padding:12px}
canvas#game{display:block;width:min(360px,calc(100vw - 150px),calc((100svh - 40px)*9/16));height:auto;aspect-ratio:9/16;background:var(--lane);border-left:5px solid var(--edge);border-right:5px solid var(--edge);box-shadow:0 0 22px rgba(59,76,255,.7);cursor:crosshair;outline:none;touch-action:none}
.panel{display:flex;flex-direction:column;gap:14px;width:96px}.panel p{margin:0 0 6px;font-size:12px;color:var(--mut)}
.panel canvas{display:block;width:92px;height:52px}.tempo{font-size:18px;color:var(--txt)}#fx{font-size:12px;white-space:pre-line;min-height:18px}
button,.back{background:none;color:var(--mut);border:1px solid var(--edge);border-radius:6px;padding:8px 6px;font:inherit;font-size:12px;text-align:center;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="360" height="640" tabindex="0" aria-label="SUPERBALL Spielfeld"></canvas>
  <div class="panel">
    <a class="back" href="../../index.html">← Menü</a>
    <div><p>Punkte</p><canvas id="ledScore" width="92" height="52"></canvas></div>
    <div><p>Rekord</p><canvas id="ledHi" width="92" height="52"></canvas></div>
    <div><p>Tempo</p><div class="tempo" id="tempo">x1.0</div></div>
    <div><p>Effekte</p><div class="tempo" id="fx">–</div></div>
    <button id="mute" type="button">Ton an</button>
  </div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=360,H=640;
var ledS=document.getElementById('ledScore'),ledH=document.getElementById('ledHi'),tempoEl=document.getElementById('tempo'),fxEl=document.getElementById('fx');
var key='superball_hi',hi=0;try{hi=+(localStorage.getItem(key)||0)}catch(e){}
var state='ready',score=0,elapsed=0,speed=200,spawnT=0,puT=8,shield=0,slowT=0,target=null,keys={};
var ball={x:W/2,y:H-70,r:20,rot:0},discs=[],pus=[],muted=false;
var colors=['#ff4d4d','#ffb020','#f5f06a','#3ddc6a','#3db8ff','#b06cff'];
function led(canvas,n){var c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);var s=String(Math.min(n,999)).padStart(3,'0'),segments={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};for(var i=0;i<3;i++){var x=2+i*30,y=3,w=24,h=44,t=5,d=s[i],g={a:[x+t,y,w-2*t,t],g:[x+t,y+h/2-t/2,w-2*t,t],d:[x+t,y+h-t,w-2*t,t],f:[x,y+t,t,h/2-t-1],b:[x+w-t,y+t,t,h/2-t-1],e:[x,y+h/2+1,t,h/2-t-1],c:[x+w-t,y+h/2+1,t,h/2-t-1]};for(var k in g){var on=segments[d].indexOf(k)>=0;c.fillStyle=on?'#3dff6a':'#12331c';c.shadowColor='#3dff6a';c.shadowBlur=on?8:0;c.fillRect.apply(c,g[k])}}}
function hud(){led(ledS,score);led(ledH,hi);tempoEl.textContent='x'+(speed/200).toFixed(1);fxEl.textContent=(shield?'Schild '+shield+'/3':'')+(shield&&slowT?'\n':'')+(slowT?'Zeitlupe '+Math.ceil(slowT)+'s':'')||'–'}
function reset(){score=0;elapsed=0;speed=200;spawnT=0;puT=8;shield=0;slowT=0;discs=[];pus=[];ball.x=W/2;target=null;hud()}
function start(){reset();state='play'}
function end(){state='over';if(score>hi){hi=score;try{localStorage.setItem(key,String(hi))}catch(e){}}hud()}
function position(e){var r=cv.getBoundingClientRect();return Math.max(ball.r+2,Math.min(W-ball.r-2,(e.clientX-r.left)/r.width*W))}
// Mausbewegung steuert den Ball direkt – ein Mausklick ist dafür nicht nötig.
cv.addEventListener('pointermove',function(e){target=position(e)});
cv.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')target=null});
cv.addEventListener('pointerdown',function(e){if(state!=='play')start();target=position(e);if(e.pointerType!=='mouse'){try{cv.setPointerCapture(e.pointerId)}catch(_){}}});
cv.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')target=null});
cv.addEventListener('pointercancel',function(e){if(e.pointerType!=='mouse')target=null});
function keyEvent(e,down){var k=e.key;if(['ArrowLeft','ArrowRight','a','A','d','D',' '].indexOf(k)>=0)e.preventDefault();if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=down;if(k==='ArrowRight'||k==='d'||k==='D')keys.r=down;if(down&&(k===' '||k==='Enter')&&state!=='play')start();if(down&&(k==='m'||k==='M')){muted=!muted;document.getElementById('mute').textContent=muted?'Ton aus':'Ton an'}}
addEventListener('keydown',function(e){keyEvent(e,true)});addEventListener('keyup',function(e){keyEvent(e,false)});
document.getElementById('mute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'Ton aus':'Ton an';cv.focus()});
function update(dt){if(state!=='play')return;elapsed+=dt;speed=200+Math.min(elapsed*7,520);var old=ball.x;if(target!==null)ball.x=target;else{if(keys.l)ball.x-=380*dt;if(keys.r)ball.x+=380*dt}ball.x=Math.max(ball.r+2,Math.min(W-ball.r-2,ball.x));ball.rot+=(ball.x-old)/ball.r;var factor=slowT>0?.45:1;slowT=Math.max(0,slowT-dt);spawnT-=dt*factor;if(spawnT<=0){var r=14+Math.random()*12;discs.push({x:r+Math.random()*(W-2*r),y:-r,r:r,vy:speed*(.9+Math.random()*.3),h:Math.random()*360});spawnT=Math.max(.3,1-elapsed*.01)*(.8+Math.random()*.5)}for(var i=discs.length-1;i>=0;i--){var d=discs[i];d.y+=d.vy*dt*factor;var dx=d.x-ball.x,dy=d.y-ball.y;if(Math.hypot(dx,dy)<d.r+ball.r-4){if(shield){shield--;discs.splice(i,1)}else{end();return}}else if(d.y-d.r>H){discs.splice(i,1);score++}}puT-=dt*factor;if(puT<=0){pus.push({x:20+Math.random()*(W-40),y:-16,r:14,k:Math.random()<.65?0:1});puT=7+Math.random()*5}for(var j=pus.length-1;j>=0;j--){var p=pus[j];p.y+=speed*.7*dt*factor;if(Math.hypot(p.x-ball.x,p.y-ball.y)<p.r+ball.r){if(p.k===0)shield=Math.min(3,shield+1);else slowT=5;pus.splice(j,1)}else if(p.y>H+20)pus.splice(j,1)}hud()}
function draw(){ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(207,216,255,.25)';ctx.lineWidth=1;for(var x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);ctx.stroke()}for(var y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke()}discs.forEach(function(d){ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle='hsl('+d.h+',100%,55%)';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0});pus.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.strokeStyle=p.k?'#b06cff':'#3dd8ff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(p.k?'Z':'S',p.x,p.y+5)});ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.rot);ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fillStyle='#1a2050';ctx.shadowColor='#789cff';ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0;for(var i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,ball.r,i*Math.PI/3,(i+1)*Math.PI/3);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill()}ctx.restore();if(shield){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+7,0,Math.PI*2);ctx.strokeStyle='#3dd8ff';ctx.lineWidth=3;ctx.stroke()}if(state==='ready'||state==='over'){ctx.fillStyle='rgba(5,8,24,.78)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.fillText(state==='ready'?'SUPERBALL':'Getroffen!',W/2,260);ctx.font='16px Arial';ctx.fillStyle='#dfe6ff';ctx.fillText(state==='ready'?'Weiche den fallenden Scheiben aus.':'Punkte: '+score,W/2,310);ctx.fillText('Maus bewegen oder Finger ziehen',W/2,360);ctx.fillText('Klicke oder drücke Leertaste zum '+(state==='ready'?'Start':'Neustart'),W/2,410)}}
var last=performance.now();function loop(now){var dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop);cv.focus();
})();
</script>
</body>
</html>
