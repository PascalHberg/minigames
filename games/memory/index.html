<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMORY</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <script src="../../shared/core.js"></script>
  <style>
    :root {
      --bg: #050818;
      --lane: #0a1030;
      --edge: #3b4cff;
      --grid: #cfd8ff;
      --led: #3dff6a;
      --ledoff: #12331c;
      --red: #ff2a2a;
      --txt: #dfe6ff;
      --mut: #8a97d6;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(1px 1px at 14% 22%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1.5px 1.5px at 78% 12%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 62% 81%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 88% 58%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 26% 74%, rgba(255,255,255,0.35), transparent),
        radial-gradient(circle at 50% 45%, #090f2b 0%, var(--bg) 75%);
      color: var(--txt);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    /* Spielfeld-Container im SUPERBALL-Stil */
    .arena {
      width: min(500px, 92vw);
      min-height: 580px;
      background-color: var(--lane);
      background-image:
        linear-gradient(to right, rgba(207, 216, 255, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(207, 216, 255, 0.08) 1px, transparent 1px);
      background-size: 44px 44px;
      border-left: 5px solid var(--edge);
      border-right: 5px solid var(--edge);
      box-shadow: 0 0 28px rgba(59, 76, 255, 0.45), inset 0 0 24px rgba(5, 8, 24, 0.7);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .arena-header {
      text-align: center;
      margin-bottom: 14px;
    }

    .arena-header h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .arena-sub {
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--mut);
    }

    /* Karten-Grid */
    #board {
      width: 100%;
      display: grid;
      gap: 10px;
      margin: auto 0;
    }

    .card {
      aspect-ratio: 1 / 1;
      background: rgba(10, 16, 48, 0.92);
      border: 2px solid var(--edge);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(59, 76, 255, 0.2);
      transition: transform 0.14s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover:not(.flipped):not(.matched) {
      border-color: var(--grid);
      transform: translateY(-2px);
      box-shadow: 0 0 14px rgba(207, 216, 255, 0.35);
    }

    .card .back {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: repeating-linear-gradient(
        45deg,
        rgba(59, 76, 255, 0.08),
        rgba(59, 76, 255, 0.08) 6px,
        transparent 6px,
        transparent 12px
      );
    }

    .card .back::after {
      content: "";
      width: 12px;
      height: 12px;
      border: 2px solid rgba(138, 151, 214, 0.45);
      transform: rotate(45deg);
    }

    .card .front {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 14%;
      background: #0e1642;
      color: var(--txt);
    }

    .card .front svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(223, 230, 255, 0.35));
    }

    .card .front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 3px;
    }

    .card.flipped .back,
    .card.matched .back {
      display: none;
    }

    .card.flipped .front,
    .card.matched .front {
      display: flex;
    }

    .card.matched {
      border-color: var(--led);
      box-shadow: 0 0 12px rgba(61, 255, 106, 0.35);
      cursor: default;
    }

    .card.matched .front {
      background: var(--ledoff);
      color: var(--led);
    }

    .card.matched .front svg {
      filter: drop-shadow(0 0 6px rgba(61, 255, 106, 0.5));
    }

    .arena-footer {
      margin-top: 14px;
      min-height: 24px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--led);
      text-align: center;
      text-shadow: 0 0 8px rgba(61, 255, 106, 0.4);
    }

    /* Rechte Seitenleiste */
    .sidebar {
      width: 165px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-side {
      width: 100%;
      background: rgba(10, 16, 48, 0.85);
      color: var(--txt);
      border: 1.5px solid var(--edge);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }

    .btn-side:hover {
      background: #131d52;
      border-color: var(--grid);
      box-shadow: 0 0 12px rgba(59, 76, 255, 0.45);
    }

    .stat-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.88rem;
      color: var(--mut);
    }

    /* 7-Segment LED-Anzeige */
    .led-display {
      display: flex;
      gap: 6px;
      padding: 2px 0;
    }

    .digit {
      position: relative;
      width: 26px;
      height: 46px;
    }

    .seg {
      position: absolute;
      background: var(--ledoff);
      border-radius: 2px;
      transition: background 0.12s, box-shadow 0.12s;
    }

    .seg.on {
      background: var(--led);
      box-shadow: 0 0 8px rgba(61, 255, 106, 0.75);
    }

    /* Horizontale Segmente: a (oben), g (mitte), d (unten) */
    .seg.a, .seg.g, .seg.d {
      left: 4px;
      width: 18px;
      height: 4px;
    }
    .seg.a { top: 0; }
    .seg.g { top: 21px; }
    .seg.d { bottom: 0; }

    /* Vertikale Segmente: f, b (oben), e, c (unten) */
    .seg.f, .seg.b, .seg.e, .seg.c {
      width: 4px;
      height: 18px;
    }
    .seg.f { top: 3px; left: 0; }
    .seg.b { top: 3px; right: 0; }
    .seg.e { bottom: 3px; left: 0; }
    .seg.c { bottom: 3px; right: 0; }

    .stat-value-text {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
    }

    .size-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 2px;
    }

    .size-btn {
      background: rgba(10, 16, 48, 0.85);
      color: var(--txt);
      border: 1.5px solid var(--edge);
      border-radius: 6px;
      padding: 7px 0;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .size-btn:hover {
      background: #131d52;
    }

    .size-btn.active {
      background: var(--edge);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(59, 76, 255, 0.6);
    }

    @media (max-width: 720px) {
      .sidebar {
        width: min(500px, 92vw);
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
      }
      .btn-side {
        width: auto;
        flex: 1 1 45%;
      }
    }
  </style>
</head>
<body>

  <div class="layout">
    <main class="arena">
      <div class="arena-header">
        <h1>MEMORY</h1>
        <div class="arena-sub">Finde alle passenden Paare in möglichst wenigen Zügen.</div>
      </div>

      <div id="board"></div>

      <div class="arena-footer" id="status">Karten aufdecken zum Starten</div>
    </main>

    <aside class="sidebar">
      <a href="../../index.html" class="btn-side">← Menü</a>

      <div class="stat-block">
        <div class="stat-label">Züge</div>
        <div class="led-display" id="led-moves"></div>
      </div>

      <div class="stat-block">
        <div class="stat-label">Rekord (<span id="hi-size-label">16</span>)</div>
        <div class="led-display" id="led-record"></div>
      </div>

      <div class="stat-block">
        <div class="stat-label">Paare</div>
        <div class="stat-value-text" id="pairs-text">0 / 8</div>
      </div>

      <div class="stat-block">
        <div class="stat-label">Spielfeld</div>
        <div class="size-grid">
          <button class="size-btn" data-size="4">4</button>
          <button class="size-btn" data-size="8">8</button>
          <button class="size-btn active" data-size="16">16</button>
          <button class="size-btn" data-size="32">32</button>
        </div>
      </div>

      <button id="restart-btn" class="btn-side">Neu starten</button>
    </aside>
  </div>

  <script>
    const HI_KEY = 'memory_hi';

    // 16 Vektor-Icons als Standard (für bis zu 32 Karten).
    // Später kannst du jedes Element einfach durch einen Bildpfad ersetzen, z. B. 'img/01.png'
    const CARD_POOL = [
      '<svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>', // Schild
      '<svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>', // Blitz
      '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>', // Stern
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>', // Zielscheibe
      '<svg viewBox="0 0 24 24"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/></svg>', // Würfel
      '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>', // Schloss
      '<svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M11 12l9-9"/><path d="M17 6l3 3"/><path d="M14 9l3 3"/></svg>', // Schlüssel
      '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/><line x1="9" y1="21" x2="15" y2="21"/></svg>', // Glühbirne
      '<svg viewBox="0 0 24 24"><polygon points="6 3 18 3 22 9 12 21 2 9 6 3"/></svg>', // Diamant
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>', // Uhr
      '<svg viewBox="0 0 24 24"><path d="M12 2C8 7 6 10 6 14a6 6 0 0 0 12 0c0-4-2-7-6-12z"/></svg>', // Flamme
      '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>', // Mond
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>', // Sonne
      '<svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>', // Code
      '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/></svg>', // Chip
      '<svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>' // WLAN
    ];

    const DIGIT_MAP = {
      '0': ['a', 'b', 'c', 'd', 'e', 'f'],
      '1': ['b', 'c'],
      '2': ['a', 'b', 'g', 'e', 'd'],
      '3': ['a', 'b', 'g', 'c', 'd'],
      '4': ['f', 'g', 'b', 'c'],
      '5': ['a', 'f', 'g', 'c', 'd'],
      '6': ['a', 'f', 'g', 'e', 'c', 'd'],
      '7': ['a', 'b', 'c'],
      '8': ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
      '9': ['a', 'b', 'c', 'd', 'f', 'g'],
      '-': ['g']
    };

    let cardCount = 16;
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let lockBoard = false;

    const boardEl = document.getElementById('board');
    const ledMovesEl = document.getElementById('led-moves');
    const ledRecordEl = document.getElementById('led-record');
    const hiSizeLabelEl = document.getElementById('hi-size-label');
    const pairsTextEl = document.getElementById('pairs-text');
    const statusEl = document.getElementById('status');
    const sizeButtons = document.querySelectorAll('.size-btn');

    function createLedDigits(container, count = 3) {
      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const digit = document.createElement('div');
        digit.className = 'digit';
        ['a', 'b', 'c', 'd', 'e', 'f', 'g'].forEach(seg => {
          const s = document.createElement('div');
          s.className = `seg ${seg}`;
          digit.appendChild(s);
        });
        container.appendChild(digit);
      }
    }

    function setLedValue(container, value) {
      const str = value === null || value === undefined
        ? '---'
        : String(Math.min(999, Math.max(0, value))).padStart(3, '0');

      const digits = container.querySelectorAll('.digit');
      str.split('').forEach((char, idx) => {
        const activeSegs = DIGIT_MAP[char] || [];
        digits[idx].querySelectorAll('.seg').forEach(segEl => {
          const segName = segEl.classList[1];
          segEl.classList.toggle('on', activeSegs.includes(segName));
        });
      });
    }

    function getBestMoves(size) {
      if (typeof Core === 'undefined' || !Core.getHi) return null;
      const data = Core.getHi(HI_KEY);
      if (data && typeof data === 'object') {
        return data[size] || null;
      }
      return null;
    }

    function saveBestMoves(size, newMoves) {
      if (typeof Core === 'undefined' || !Core.setHi) return;
      let data = Core.getHi(HI_KEY);
      if (!data || typeof data !== 'object') {
        data = {};
      }
      if (!data[size] || newMoves < data[size]) {
        data[size] = newMoves;
        Core.setHi(HI_KEY, data);
      }
    }

    function updateRecordDisplay() {
      hiSizeLabelEl.textContent = cardCount;
      setLedValue(ledRecordEl, getBestMoves(cardCount));
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setupGridColumns(count) {
      const cols = {
        4: 2,
        8: 4,
        16: 4,
        32: 8
      }[count] || 4;
      boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    }

    function initGame() {
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      lockBoard = false;

      const totalPairs = cardCount / 2;
      setLedValue(ledMovesEl, moves);
      pairsTextEl.textContent = `0 / ${totalPairs}`;
      statusEl.textContent = 'Karten aufdecken zum Starten';
      updateRecordDisplay();
      setupGridColumns(cardCount);

      const selectedIndices = Array.from({ length: totalPairs }, (_, i) => i);
      const deck = shuffle([...selectedIndices, ...selectedIndices]);

      boardEl.innerHTML = '';

      deck.forEach((poolIndex) => {
        const item = CARD_POOL[poolIndex];
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.pairId = poolIndex;

        const back = document.createElement('div');
        back.className = 'back';

        const front = document.createElement('div');
        front.className = 'front';

        if (item.trim().startsWith('<svg')) {
          front.innerHTML = item;
        } else {
          const img = document.createElement('img');
          img.src = item;
          img.alt = 'Memory Karte';
          front.appendChild(img);
        }

        card.appendChild(back);
        card.appendChild(front);
        card.addEventListener('click', () => flipCard(card));
        boardEl.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lockBoard) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        setLedValue(ledMovesEl, moves);
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.pairId === card2.dataset.pairId;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        flippedCards = [];
        matchedPairs++;

        const totalPairs = cardCount / 2;
        pairsTextEl.textContent = `${matchedPairs} / ${totalPairs}`;

        if (matchedPairs === totalPairs) {
          saveBestMoves(cardCount, moves);
          updateRecordDisplay();
          statusEl.textContent = `Geschafft in ${moves} Zügen!`;
        } else {
          statusEl.textContent = 'Paar gefunden!';
        }
      } else {
        lockBoard = true;
        statusEl.textContent = 'Kein Treffer';
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 650);
      }
    }

    sizeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        sizeButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        cardCount = parseInt(btn.dataset.size, 10);
        initGame();
      });
    });

    document.getElementById('restart-btn').addEventListener('click', initGame);

    createLedDigits(ledMovesEl, 3);
    createLedDigits(ledRecordEl, 3);
    initGame();
  </script>
</body>
</html>
